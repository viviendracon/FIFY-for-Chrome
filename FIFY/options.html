<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>De-Clickbaiter Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      color: #202124;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #5f6368; font-size: 14px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #dadce0; }
    th { font-size: 13px; color: #5f6368; }
    input[type="text"] {
      width: 90%;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #dadce0;
      background: #fff;
    }
    button.primary {
      background: #1a73e8;
      color: #fff;
      border: none;
    }
    button.remove {
      color: #d93025;
      border: none;
      background: transparent;
      padding: 4px 8px;
    }
    .actions { display: flex; gap: 8px; align-items: center; }
    #status { font-size: 13px; color: #188038; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Headline Replacement Rules</h1>
  <p>Words are matched case-insensitively. The replacement will automatically adapt to standard uppercase or capitalized text.</p>

  <table id="rulesTable">
    <thead>
      <tr>
        <th style="width: 45%;">Hype / Buzzword</th>
        <th style="width: 45%;">Replacement</th>
        <th style="width: 10%;"></th>
      </tr>
    </thead>
    <tbody id="rulesBody"></tbody>
  </table>

  <div class="actions">
    <button id="addBtn">+ Add Row</button>
    <button id="saveBtn" class="primary">Save Changes</button>
    <button id="resetBtn">Reset Defaults</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
